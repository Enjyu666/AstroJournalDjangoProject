{% extends "base.html" %}

{% block title %}Delete Object | AstroJournal{% endblock %}

{% block content %}
<section class="confirmation-panel">
    <div class="warning-icon">!</div>
    <h1>Delete this object?</h1>
    <p>
        You're about to delete <strong>{{ object.name }}</strong>.
        This action cannot be undone.
    </p>

    <form method="post" class="action-row">
        {% csrf_token %}
        <button class="button button-danger" type="submit">
            Yes, delete object
        </button>
        <a class="button button-secondary"
           href="{% url 'objects:details' object.pk %}">Keep object</a>
    </form>
</section>
{% endblock %}
