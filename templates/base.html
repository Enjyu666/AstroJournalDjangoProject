<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AstroJournal{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <nav class="navbar container">
            <a class="brand" href="{% url 'home' %}">
                <span class="brand-icon">✦</span> AstroJournal
            </a>

            <div class="nav-links">
                <a href="{% url 'home' %}">Home</a>
                <a href="{% url 'objects:object_list' %}">Sky Objects</a>
                <a href="{% url 'equipment:equipment_list' %}">Equipment</a>
                <a href="{% url 'observations:observation_list' %}">Observations</a>
                <a href="{% url 'observations:gallery' %}">Gallery</a>
            </div>
        </nav>
    </header>

    <main class="container main-content">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>AstroJournal · A personal journal for exploring the night sky.</p>
        </div>
    </footer>
</body>
</html>
